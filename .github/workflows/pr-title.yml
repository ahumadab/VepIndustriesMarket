name: PR title

# GitHub squashes a PR under its title: it must pass the same check as a commit subject.
# A PR from feature/<n>-... closes its ticket: its body says "Closes #<n>" (docs/agents/issue-tracker.md).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/commit-subject.mjs "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
  closes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          n=$(printf '%s' "$BRANCH" | sed -nE 's#^feature/([0-9]+)-.*#\1#p')
          if [ -n "$n" ] && ! printf '%s' "$BODY" | grep -qE "Closes #$n\b"; then
            echo "✗ corps de la PR sans « Closes #$n » : une PR ferme son ticket (docs/agents/issue-tracker.md)"
            exit 1
          fi
        env:
          BRANCH: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
